# cargo-deny configuration.
#
# Run locally:
#   cargo install cargo-deny --locked
#   cargo deny check
#
# CI runs the same command on every PR plus a weekly schedule.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
# Ignored advisories are entirely transitive deps of Tauri 2 (gtk-rs
# GTK3 ecosystem) plus a few utility crates Tauri pulls in. They are
# all marked "unmaintained" upstream — not security vulnerabilities.
# We re-evaluate on every Tauri major upgrade. None of these crates
# are reachable from the verifier or .win container parser.
ignore = [
    # gtk-rs GTK3 ecosystem (atk, gtk, gdk, glib-sys, etc.) — Tauri 2
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # fxhash — unmaintained, used transitively
    "RUSTSEC-2025-0057",
    # proc-macro-error v1 — unmaintained, used transitively
    "RUSTSEC-2024-0370",
    # Other transitive Tauri 2 deps (instant, chrono OOB pre-fix, etc.)
    "RUSTSEC-2023-0071",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2026-0097",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace (path = "../crates/X") are
# in-tree, not from crates.io, and don't need explicit versions.
# Without this opt-in cargo-deny flags every one of them as a wildcard.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
