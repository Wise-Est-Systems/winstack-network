name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The wise-desktop crate is a Tauri 2 app. Tauri requires GTK/WebKit
  # system libraries that aren't pre-installed on Ubuntu / Windows CI
  # runners, and the desktop app currently only ships on macOS (per
  # README). Every non-macOS job below excludes wise-desktop so the
  # verifier / CLI / WASM crates can still be lint/test/build-checked
  # on Linux + Windows. The macOS test job keeps the full --workspace
  # so the desktop app is exercised end-to-end on its target platform.
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude wise-desktop --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cargo_args: "--workspace --all-features"
          - os: ubuntu-latest
            cargo_args: "--workspace --exclude wise-desktop --all-features"
          - os: windows-latest
            cargo_args: "--workspace --exclude wise-desktop --all-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.cargo_args }} --no-fail-fast

  msrv:
    name: MSRV (rust 1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude wise-desktop --all-targets

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --exclude wise-desktop --no-deps --document-private-items
