name: Bug report
description: A defect in shipped behavior — verification, sealing, UX, or build.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. For security issues see [SECURITY.md](../SECURITY.md) — do not file in public.

  - type: input
    id: version
    attributes:
      label: Version
      description: "`win --version`, the desktop app version, or the commit SHA."
      placeholder: "0.2.0 / abc123d"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15.4 (Apple Silicon), Ubuntu 24.04, Windows 11 …"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI (wise / win / winopen)
        - Desktop app
        - Browser verifier (window/check.html, public/v.html)
        - WASM verifier (verifier-wasm)
        - Library crate (specify in description)
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Smallest steps that reproduce the issue, including a minimal `.win` if relevant (strip private content).
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What state did you expect (Alive / Wounded / Unrecognized / Dying), and what did you observe?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
