<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winstack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--surface:#0f0f12;--card:#141418;--elevated:#1a1a20;--border:#1f1f28;--border-h:#2a2a36;--muted:#4a4a5a;--subtle:#6a6a7e;--text:#d0d0dc;--bright:#f0f0f6;--white:#fafafa;--green:#34d399;--green-soft:#34d39918;--green-border:#166534;--red:#f87171;--red-soft:#f8717118;--red-border:#7f1d1d;--amber:#fbbf24;--amber-soft:#fbbf2418;--amber-border:#78350f;--blue:#60a5fa;--blue-soft:#60a5fa18;--blue-border:#1e3a5f;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:'SF Mono','Fira Code','Consolas',monospace;--radius:16px;--radius-sm:10px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
::selection{background:var(--green);color:var(--bg)}
nav{padding:0 24px;height:48px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;-webkit-app-region:drag}
.logo{font-size:13px;font-weight:600;letter-spacing:0.08em;color:var(--bright)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px}
.app{width:100%;max-width:420px;text-align:center}
h1{font-size:22px;font-weight:600;color:var(--bright);margin-bottom:8px}
.sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:36px}
.drop{position:relative;border:2px dashed var(--border);background:var(--card);border-radius:var(--radius);padding:48px 24px;cursor:pointer;transition:all 0.25s;margin-bottom:20px}
.drop:hover{border-color:var(--border-h);background:var(--elevated)}
.drop.over{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 1px var(--green),0 0 24px var(--green-soft)}
.drop.picked{border-style:solid;border-color:var(--border-h);background:var(--elevated)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-label{font-size:15px;font-weight:500;color:var(--muted);pointer-events:none;transition:color 0.15s}
.drop.picked .drop-label{color:var(--bright)}
.drop-hint{font-size:12px;color:var(--muted);opacity:0.4;margin-top:6px;pointer-events:none}
.drop.picked .drop-hint{display:none}
.processing{display:none;text-align:center;padding:48px 0}
.dot{width:7px;height:7px;background:var(--subtle);border-radius:50%;display:inline-block;margin:0 4px;animation:pulse 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
.proc-label{font-size:14px;color:var(--muted);margin-top:20px}
.outcome{display:none;width:100%;max-width:480px}
.verdict{text-align:center;padding:52px 32px 44px;border-radius:var(--radius);margin-bottom:24px;position:relative;overflow:hidden}
.verdict::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
.verdict.show::after{opacity:1}
.verdict.ok{background:var(--green-soft);border:1px solid var(--green-border)}
.verdict.ok::after{background:radial-gradient(ellipse at 50% 40%,#34d39920,transparent 70%)}
.verdict.bad{background:var(--red-soft);border:1px solid var(--red-border)}
.verdict.bad::after{background:radial-gradient(ellipse at 50% 40%,#f8717120,transparent 70%)}
.verdict.warn{background:var(--amber-soft);border:1px solid var(--amber-border)}
.verdict.warn::after{background:radial-gradient(ellipse at 50% 40%,#fbbf2420,transparent 70%)}
.verdict.sealed{background:var(--blue-soft);border:1px solid var(--blue-border)}
.verdict.sealed::after{background:radial-gradient(ellipse at 50% 40%,#60a5fa20,transparent 70%)}
.verdict.damaged{background:#78350f18;border:1px solid #78350f}
.verdict.damaged::after{background:radial-gradient(ellipse at 50% 40%,#f59e0b20,transparent 70%)}
.verdict-status{font-size:40px;font-weight:700;letter-spacing:.04em;line-height:1}
.verdict.ok .verdict-status{color:var(--green)}.verdict.bad .verdict-status{color:var(--red)}.verdict.warn .verdict-status{color:var(--amber)}.verdict.sealed .verdict-status{color:var(--blue)}.verdict.damaged .verdict-status{color:#f59e0b}
.verdict-explain{font-size:14px;color:var(--text);margin-top:16px;line-height:1.6}
.verdict-meta{display:inline-block;font-size:11px;color:var(--muted);margin-top:16px;padding:4px 12px;border:1px solid var(--border);border-radius:4px}
.mismatch{border:1px solid var(--red-border);background:var(--red-soft);border-radius:var(--radius-sm);padding:16px 20px;margin-bottom:16px;text-align:left}
.mm-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.mm-label.a{color:var(--red)}.mm-label.b{color:var(--muted)}
.mm-val{font-size:11px;font-family:var(--mono);word-break:break-all;line-height:1.5}
.mm-val.a{color:var(--bright)}.mm-val.b{color:var(--muted)}
.mm-sep{height:1px;background:var(--red-border);margin:10px 0}
.err{border:1px solid var(--red-border);background:var(--red-soft);border-radius:var(--radius-sm);padding:14px 20px;margin-bottom:16px;font-size:13px;color:var(--red);line-height:1.5;text-align:left}
.details-toggle{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:var(--sans)}
.details-toggle:hover{color:var(--subtle)}
.details-panel{display:none;margin-top:12px;text-align:left;background:var(--card);border-radius:var(--radius-sm);padding:16px 20px}
.details-panel.open{display:block}
.detail{display:flex;gap:8px;margin-bottom:6px;font-size:12px}.detail:last-child{margin-bottom:0}
.detail-k{color:var(--muted);white-space:nowrap;min-width:80px}
.detail-v{color:var(--subtle);word-break:break-all;font-family:var(--mono);font-size:11px}
.save-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);background:var(--green);color:var(--bg);font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px;transition:opacity 0.15s}
.save-btn:hover{opacity:0.9}
.again{margin-top:24px;font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:var(--sans);text-decoration:underline;text-underline-offset:3px}
.again:hover{color:var(--text)}
.note{font-size:11px;color:var(--muted);opacity:.4;margin-top:12px}
footer{padding:8px 24px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.foot{font-size:10px;color:var(--muted);opacity:.3}
.hidden{display:none!important}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.enter{animation:enter .3s ease-out both}
</style>
</head>
<body>
<nav><div class="logo">Winstack</div></nav>
<main>
<div class="app">
  <div id="input-state">
    <h1>Drop a file</h1>
    <p class="sub">Drop any file to seal it. Drop a .win file to check it.</p>
    <div class="drop" id="the-drop">
      <input type="file" id="the-input">
      <div class="drop-label" id="the-label">Drop a file here</div>
      <div class="drop-hint">or click to browse</div>
    </div>
    <p class="note">Everything stays on your device.</p>
  </div>
  <div class="processing" id="proc-state">
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="proc-label" id="proc-label"></div>
  </div>
  <div class="outcome" id="result-state">
    <div class="err hidden" id="r-err"></div>
    <div class="verdict" id="r-verdict">
      <div class="verdict-status" id="r-status"></div>
      <div class="verdict-explain" id="r-explain"></div>
      <div class="verdict-meta hidden" id="r-meta"></div>
    </div>
    <div class="mismatch hidden" id="r-mm">
      <div class="mm-label a">This file</div><div class="mm-val a" id="r-mm-a"></div>
      <div class="mm-sep"></div>
      <div class="mm-label b">The one that was named</div><div class="mm-val b" id="r-mm-b"></div>
    </div>
    <button class="save-btn hidden" id="r-save">Save file</button>
    <button class="details-toggle" id="r-dtoggle">View details</button>
    <div class="details-panel" id="r-dpanel"></div>
    <button class="again" id="r-again">Start over</button>
  </div>
</div>
</main>
<footer><span class="foot">Winstack</span></footer>
<script>
// Block ALL native file-drop navigation — must be first, capture phase
document.addEventListener('dragover', function(e) { e.preventDefault(); }, true);
document.addEventListener('drop', function(e) { e.preventDefault(); }, true);

var API_PORT = 13845;
function getAPI() { return window.WINSTACK_API_BASE || ('http://127.0.0.1:' + API_PORT); }
function authHeaders() {
  var h = {};
  if (window.WINSTACK_TOKEN) h['Authorization'] = 'Bearer ' + window.WINSTACK_TOKEN;
  return h;
}
var $ = function(id) { return document.getElementById(id); };
var esc = function(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
var trunc = function(s, n) { n = n || 28; return s.length > n ? s.slice(0, n-1) + '\u2026' : s; };

// .win parser (matches win-format crate)
var WIN_MAGIC = [0x57, 0x49, 0x4E, 0x01];
function parseWin(buf) {
  var view = new DataView(buf);
  if (buf.byteLength < 16) return null;
  for (var i = 0; i < 4; i++) { if (view.getUint8(i) !== WIN_MAGIC[i]) return null; }
  var nameLen = view.getUint32(4, true);
  if (nameLen > 4096) return null;
  var nameEnd = 8 + nameLen;
  if (buf.byteLength < nameEnd + 8) return null;
  var nameBytes = new Uint8Array(buf, 8, nameLen);
  var filename = new TextDecoder().decode(nameBytes);
  var parts = filename.split(/[\/\\]/); filename = parts[parts.length - 1];
  if (!filename || filename.indexOf('\0') >= 0) return null;
  var fileLenLow = view.getUint32(nameEnd, true);
  var fileLenHigh = view.getUint32(nameEnd + 4, true);
  if (fileLenHigh > 0) return null;
  var fileLen = fileLenLow;
  var fileStart = nameEnd + 8;
  var fileEnd = fileStart + fileLen;
  if (buf.byteLength < fileEnd + 1) return null;
  return { filename: filename, fileBytes: new Uint8Array(buf, fileStart, fileLen) };
}

// Stash extracted file for save button
var extractedFile = null;
var extractedName = null;
function dt(k, v) { return '<div class="detail"><span class="detail-k">'+esc(k)+'</span><span class="detail-v">'+esc(v)+'</span></div>'; }

function show(s) {
  $('input-state').style.display = s === 'input' ? 'block' : 'none';
  $('proc-state').style.display = s === 'proc' ? 'block' : 'none';
  $('result-state').style.display = s === 'result' ? 'block' : 'none';
}

// ── DROP ZONE ──
var dropZone = $('the-drop');
var dropInput = $('the-input');
var dropLabel = $('the-label');

dropInput.addEventListener('change', function() {
  if (this.files && this.files[0]) handleFile(this.files[0]);
});
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); this.classList.add('over'); });
dropZone.addEventListener('dragleave', function(e) { e.preventDefault(); e.stopPropagation(); this.classList.remove('over'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault(); e.stopPropagation(); this.classList.remove('over');
  var files = e.dataTransfer && e.dataTransfer.files;
  if (files && files.length > 0) handleFile(files[0]);
});

function handleFile(f) {
  dropZone.classList.add('picked');
  dropLabel.textContent = trunc(f.name);

  if (f.name.endsWith('.win')) {
    $('proc-label').textContent = 'Recognizing';
    show('proc');
    // Read the file once, use for both local parsing and API upload
    f.arrayBuffer().then(function(buf) {
      var parsed = parseWin(buf);
      if (parsed) { extractedFile = parsed.fileBytes; extractedName = parsed.filename; }
      else { extractedFile = null; extractedName = null; }
      // Send the raw bytes as a new Blob (not the consumed File)
      var form = new FormData();
      form.append('file', new Blob([buf]), f.name);
      return fetch(getAPI() + '/check', { method: 'POST', body: form });
    })
      .then(function(res) {
        if (!res.ok) return res.json().then(function(j) { throw new Error(j.error ? j.error.message : 'Error ' + res.status); });
        return res.json();
      })
      .then(function(d) { show('result'); renderVerify(d, f.name); })
      .catch(function(e) { show('result'); showErr(e.message || 'Cannot connect.'); });
  } else {
    $('proc-label').textContent = 'Naming';
    show('proc');
    var form = new FormData();
    form.append('file', f);
    fetch(getAPI() + '/seal', { method: 'POST', body: form, headers: authHeaders() })
      .then(function(res) {
        if (!res.ok) return res.json().then(function(j) { throw new Error(j.error ? j.error.message : 'Error ' + res.status); });
        return res.blob();
      })
      .then(function(blob) { show('result'); renderSeal(f.name, f.name + '.win'); })
      .catch(function(e) { show('result'); showErr(e.message || 'Cannot connect.'); });
  }
}

function showErr(m) { $('r-verdict').style.display = 'none'; $('r-err').classList.remove('hidden'); $('r-err').textContent = m; }

function renderVerify(d, fname) {
  $('r-err').classList.add('hidden');
  $('r-mm').classList.add('hidden');
  $('r-meta').classList.add('hidden');
  $('r-save').classList.add('hidden');
  $('r-dpanel').classList.remove('open');
  $('r-dtoggle').textContent = 'View details';
  var v = $('r-verdict'); v.style.display = 'block';
  var r = d.result;
  if (r === 'Alive') {
    v.className = 'verdict enter ok';
    $('r-status').textContent = 'Alive';
    var explain = 'This file is alive. Unchanged since it was named.';
    if (d.chain_status === 'successor') explain += ' Part of a lineage.';
    else if (d.chain_status === 'origin') explain += ' First in its lineage.';
    $('r-explain').textContent = explain;
    var m = $('r-meta'); m.classList.remove('hidden');
    var metaText = 'Witness recognized';
    if (d.time_source === 'External') metaText += ' \u2022 Anchored birthday';
    else metaText += ' \u2022 Local birthday only';
    m.textContent = metaText;
    // Show save button if we extracted the file
    if (extractedFile && extractedName) {
      var sb = $('r-save');
      sb.classList.remove('hidden');
      sb.textContent = 'Save ' + extractedName;
    }
  } else if (r === 'Wounded') {
    v.className = 'verdict enter bad';
    $('r-status').textContent = 'Wounded';
    $('r-explain').textContent = 'This file was alive once. It has been changed since it was named. The original is gone.';
    $('r-mm').classList.remove('hidden');
    $('r-mm-a').textContent = d.file_hash;
    $('r-mm-b').textContent = d.expected_hash;
  } else if (r === 'Dying') {
    v.className = 'verdict enter damaged';
    $('r-status').textContent = 'Dying';
    $('r-explain').textContent = d.message || 'This name tag is decomposing. The file underneath may still be alive \u2014 its name tag is just unreadable.';
  } else {
    // Unrecognized \u2014 and any unhandled result
    v.className = 'verdict enter warn';
    $('r-status').textContent = 'Unrecognized';
    var reason = "I can't read this name tag. The file may still be fine, but I can't tell you who named it.";
    if (d.failures && d.failures.length > 0) reason += ' ' + d.failures[0].reason + '.';
    $('r-explain').textContent = reason;
  }
  requestAnimationFrame(function() { requestAnimationFrame(function() { v.classList.add('show'); }); });
  var ts = d.time_source === 'External'
    ? 'Anchored \u2014 externally timestamped (RFC 3161)'
    : 'Local \u2014 from the witness\u2019s device clock';
  $('r-dpanel').innerHTML = [
    dt('File', fname),
    dt('Born', d.created_at),
    dt('Hash', d.payload_hash),
    dt('Time', ts),
    dt('Witness', d.creator_key ? d.creator_key.slice(0,8) + '\u2026' + d.creator_key.slice(56) : 'unknown'),
    dt('Recognized by', 'Desktop app'),
  ].join('');
}

function renderSeal(orig, winName) {
  $('r-err').classList.add('hidden');
  $('r-mm').classList.add('hidden');
  $('r-meta').classList.add('hidden');
  $('r-dpanel').classList.remove('open');
  $('r-dtoggle').textContent = 'View details';
  var v = $('r-verdict'); v.style.display = 'block';
  v.className = 'verdict enter sealed';
  requestAnimationFrame(function() { requestAnimationFrame(function() { v.classList.add('show'); }); });
  $('r-status').textContent = 'Named';
  $('r-explain').textContent = winName + ' saved to your Downloads folder. Send it to anyone \u2014 they can recognize it by dropping it here or at winstack.dev.';
  var m = $('r-meta'); m.classList.remove('hidden'); m.textContent = 'File + name tag in one package';
}

$('r-dtoggle').addEventListener('click', function() {
  var o = $('r-dpanel').classList.toggle('open');
  $('r-dtoggle').textContent = o ? 'Hide details' : 'View details';
});
$('r-save').addEventListener('click', function() {
  if (!extractedFile || !extractedName) return;
  // Send the file to the server to save and open
  var form = new FormData();
  form.append('filename', extractedName);
  form.append('file', new Blob([extractedFile]), extractedName);
  fetch(getAPI() + '/save-and-open', { method: 'POST', body: form, headers: authHeaders() })
    .catch(function() {
      // Fallback: blob download
      var blob = new Blob([extractedFile]);
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = extractedName;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
});
$('r-again').addEventListener('click', function() {
  extractedFile = null; extractedName = null;
  dropZone.classList.remove('picked');
  dropLabel.textContent = 'Drop a file here';
  $('the-input').value = '';
  show('input');
});

// Allow dropping a file anywhere on the page — even on the result screen
document.body.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); });
document.body.addEventListener('drop', function(e) {
  e.preventDefault(); e.stopPropagation();
  var files = e.dataTransfer && e.dataTransfer.files;
  if (files && files.length > 0) {
    // Reset UI and process the new file
    dropZone.classList.remove('picked');
    dropLabel.textContent = 'Drop a file here';
    $('the-input').value = '';
    handleFile(files[0]);
  }
});

// Handle .win file opened via macOS file association
function handleWinResult(d) {
  show('result');
  renderVerify(d, d.object_id ? 'file.win' : 'file');
}
</script>
</body>
</html>
